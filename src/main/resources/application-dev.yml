spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5444/payment_service
    username: postgres
    password: ${POSTGRES_PASSWORD}

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    properties:
      hibernate:
        format_sql: true

jwt:
  cookie-secure: false

billing:
  cron: "*/30 * * * * *"
  interval-days: 1
  retry-interval-days: 1

verification:
  lockout-minutes: 1

springdoc:
  swagger-ui:
    display-request-duration: true
    try-it-out-enabled: true
