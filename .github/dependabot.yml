version: 2

updates:
  # Зависимости и плагины Maven
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      # Патчи и минорные версии - одним PR, чтобы не плодить мелочь.
      # Мажорные приходят отдельно: их нужно разбирать поштучно
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Версии GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
